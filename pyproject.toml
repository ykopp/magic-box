[project]
name = "magic-box"
version = "2.3.0"
description = "Apple Silicon local TTS podcast studio (Qwen3-TTS + VoxCPM)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Magic Box contributors" }]

dependencies = [
    "streamlit>=1.30",
    "mlx>=0.16",
    "mlx-audio>=0.4.3",
    "soundfile>=0.12",
    "numpy>=1.26",
    "requests>=2.31",
    "lxml>=5.0",
    "huggingface_hub>=0.23",
    "transformers>=4.43",
    "pyloudnorm>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
magic-box = "podcast_generator:main"
magic-box-route = "model_route_cli:main"
magic-box-benchmark = "benchmark_tts_backends:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # function call in default argument (FastAPI-style)
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
